<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - LaundryPing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0d968b",
              "background-light": "#f6f8f8",
              "background-dark": "#102220",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="flex min-h-screen flex-col items-center justify-center px-6 py-12 lg:px-8">
<!-- Login Card Container -->
<div class="sm:mx-auto sm:w-full sm:max-w-[440px]">
<div class="bg-white dark:bg-background-dark/50 p-8 sm:p-12 rounded-xl shadow-sm border border-primary/10">
<!-- Logo Section -->
<div class="flex flex-col items-center justify-center mb-10">
<div class="flex items-center gap-2 text-primary">
<div class="size-8 flex items-center justify-center rounded-lg bg-primary/10">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1">local_laundry_service</span>
</div>
<h2 class="text-[#111817] dark:text-white text-xl font-bold leading-tight tracking-tight">LaundryPing</h2>
</div>
</div>
<!-- Heading -->
<div class="text-center mb-8">
<h1 class="text-2xl font-bold tracking-tight text-[#111817] dark:text-white">Log in</h1>
<p class="mt-2 text-sm text-[#618986] dark:text-[#618986]/80">Enter your credentials to access your account</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block text-sm font-medium leading-6 text-[#111817] dark:text-white mb-2" for="email">Email address</label>
<div class="relative">
<input autocomplete="email" class="block w-full rounded-lg border-0 py-3 text-[#111817] shadow-sm ring-1 ring-inset ring-[#dbe6e5] placeholder:text-[#618986]/60 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 dark:bg-background-dark/30 dark:ring-primary/20 dark:text-white" id="email" name="email" placeholder="e.g., alex@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block text-sm font-medium leading-6 text-[#111817] dark:text-white" for="password">Password</label>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="block w-full rounded-lg border-0 py-3 text-[#111817] shadow-sm ring-1 ring-inset ring-[#dbe6e5] placeholder:text-[#618986]/60 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 dark:bg-background-dark/30 dark:ring-primary/20 dark:text-white" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#618986]" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<div>
<button class="flex w-full justify-center rounded-lg bg-primary px-3 py-3.5 text-sm font-bold leading-6 text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors" type="submit">
                            Log in
                        </button>
</div>
</form>
<!-- Optional Footer (Minimal) -->
<div class="mt-10 text-center text-xs text-[#618986]">
<p>© 2024 LaundryPing. All rights reserved.</p>
</div>
</div>
</div>
</div>
</body></html>
