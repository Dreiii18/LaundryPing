<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d968b",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen text-[#111817]">
<!-- Mock Dashboard Background (Blurred for Modal effect) -->
<div class="fixed inset-0 z-0 flex flex-col overflow-hidden filter blur-sm grayscale-[0.2]">
<nav class="border-b border-primary/10 bg-white px-8 py-4 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white">
<span class="material-symbols-outlined text-sm">local_laundry_service</span>
</div>
<span class="font-bold text-xl tracking-tight text-primary">LaundryPing</span>
</div>
<div class="flex gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10"></div>
</div>
</nav>
<main class="p-8 grid grid-cols-4 gap-6">
<div class="h-32 rounded-xl bg-white border border-primary/10 p-4"></div>
<div class="h-32 rounded-xl bg-white border border-primary/10 p-4"></div>
<div class="h-32 rounded-xl bg-white border border-primary/10 p-4"></div>
<div class="h-32 rounded-xl bg-white border border-primary/10 p-4"></div>
<div class="col-span-4 h-96 rounded-xl bg-white border border-primary/10 p-4"></div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-[#102220]/60 backdrop-blur-sm p-4">
<!-- Modal Container -->
<div class="relative w-full max-w-[520px] bg-white dark:bg-background-dark rounded-xl shadow-2xl overflow-hidden border border-primary/10 animate-in fade-in zoom-in duration-200">
<!-- Modal Header -->
<div class="flex items-center justify-between px-8 pt-8 pb-4">
<div>
<h2 class="text-2xl font-bold text-[#111817] dark:text-white">Start New Job</h2>
<p class="text-sm text-[#618986] mt-1">Assign a machine and customer details.</p>
</div>
<button class="p-2 hover:bg-primary/5 rounded-full transition-colors text-[#618986]">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Content (Form) -->
<div class="px-8 py-4 space-y-6">
<!-- Machine Selection -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-[#111817] dark:text-white flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary">settings_applications</span>
                        Machine ID
                    </label>
<div class="relative">
<select class="w-full h-12 px-4 rounded-lg border border-[#dbe6e5] bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary text-base font-normal outline-none transition-all appearance-none cursor-pointer">
<option disabled="" selected="" value="">Select Machine (W1, W2, D1, D2)</option>
<option value="W1">Washing Machine 1 (W1)</option>
<option value="W2">Washing Machine 2 (W2)</option>
<option value="D1">Dryer 1 (D1)</option>
<option value="D2">Dryer 2 (D2)</option>
</select>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-[#111817] dark:text-white flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary">phone_iphone</span>
                        Phone Number
                    </label>
<input class="w-full h-12 px-4 rounded-lg border border-[#dbe6e5] bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary text-base font-normal outline-none transition-all placeholder:text-[#618986]/60" placeholder="09xxxxxxxxx" type="text"/>
</div>
<!-- Notes -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-[#111817] dark:text-white flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary">sticky_note_2</span>
                        Notes (Optional)
                    </label>
<textarea class="w-full min-h-[120px] p-4 rounded-lg border border-[#dbe6e5] bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary text-base font-normal outline-none transition-all resize-none placeholder:text-[#618986]/60" placeholder="e.g., Extra spin, delicate wash, low heat dryer"></textarea>
</div>
</div>
<!-- Modal Footer (Actions) -->
<div class="px-8 pb-8 pt-4 flex items-center justify-end gap-3">
<button class="px-6 h-12 font-semibold text-[#111817] hover:bg-primary/5 rounded-lg transition-colors border border-transparent">
                    Cancel
                </button>
<button class="px-8 h-12 font-bold text-white bg-primary hover:bg-primary/90 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center gap-2">
<span>Start Job</span>
<span class="material-symbols-outlined text-[20px]">play_arrow</span>
</button>
</div>
<!-- Decorative side accent -->
<div class="absolute top-0 left-0 w-1.5 h-full bg-primary"></div>
</div>
</div>
</body></html>
